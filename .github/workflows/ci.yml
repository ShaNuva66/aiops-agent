name: Verify local MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q --cov=backend --cov-fail-under=85
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker compose -f docker-compose.yml -f infrastructure/compose.test.yml up -d --build --wait --wait-timeout 240
      - run: uv run python scripts/e2e_lab.py
      - run: docker compose down
        if: always()
