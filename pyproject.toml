[project]
name = "aiops-agent"
version = "0.1.0"
description = "Evidence-based IT operations in an isolated local lab"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "psutil>=6,<8",
  "openai-agents>=0.2,<1", "qdrant-client>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
